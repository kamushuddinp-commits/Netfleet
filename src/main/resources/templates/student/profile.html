<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('My Profile – LearnHub')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="custom-card p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="course-icon-box mb-0" style="width: 64px; height: 64px; font-size: 2rem;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-1" th:text="${student.fullName}">Alice Johnson</h3>
                        <div class="text-muted small">
                            <span class="badge bg-primary me-2">Registered Student</span>
                            <span th:text="${student.email}">alice@example.com</span>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <div class="p-3 bg-light rounded-3">
                            <div class="text-muted small">Student Identification Number</div>
                            <strong class="fs-5" th:text="${student.studentNumber}">STU-2026-001</strong>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="p-3 bg-light rounded-3">
                            <div class="text-muted small">Declared Major</div>
                            <strong class="fs-5" th:text="${student.major}">Computer Science</strong>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="p-3 bg-light rounded-3">
                            <div class="text-muted small">Active Course Enrollments</div>
                            <strong class="fs-5 text-primary" th:text="${enrollmentCount} + ' Courses'">3 Courses</strong>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="p-3 bg-light rounded-3">
                            <div class="text-muted small">Account Role</div>
                            <strong class="fs-5 text-success">Student Portal User</strong>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{/student/courses}" class="btn btn-primary rounded-pill px-4">Browse Courses</a>
                    <a th:href="@{/student/my-courses}" class="btn btn-outline-secondary rounded-pill px-4">View My Enrollments</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
